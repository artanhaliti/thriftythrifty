<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>ThriftyThrifty</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#f5f8f6;--ink:#0c1a13;--mut:#66756d;--line:#e6ebe8;--g:#0e9f62;--gd:#075a38;--g2:#e5f6ed;--neg:#d4483b;--sh:0 1px 2px rgba(12,26,19,.04),0 8px 24px rgba(12,26,19,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b120f;--soft:#121c17;--ink:#eef4f0;--mut:#8fa196;--line:#223028;--g2:#12301f;--sh:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b120f;--soft:#121c17;--ink:#eef4f0;--mut:#8fa196;--line:#223028;--g2:#12301f;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14.5px/1.45 Manrope,system-ui,sans-serif;letter-spacing:-.005em}
button,input,select{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:0 10px 18px;letter-spacing:-.03em}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--g);color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px}
.nl{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--mut);font-weight:600;position:relative}
.nl svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nl:hover{background:var(--soft);color:var(--ink)}.nl.on{background:var(--g2);color:var(--gd)}
@media(prefers-color-scheme:dark){.nl.on{color:#6ee7b7}}
.bd{background:var(--g);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px;margin-left:auto;font-weight:700}
.side-f{margin-top:auto;display:grid;gap:8px;padding:10px}
.side-f label{font-size:12px;color:var(--mut)}
main{padding:28px 36px 60px;max-width:1120px;width:100%;margin:0 auto}
h1{font-size:28px;letter-spacing:-.03em;margin:0;font-weight:800}h2{font-size:16px;margin:0;font-weight:700;letter-spacing:-.02em}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}.sub{color:var(--mut)}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 15px;font-weight:700;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--soft)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--g);border-color:var(--g);color:#fff}.btn.p:hover{background:var(--gd)}.btn.d{color:var(--neg)}.btn.s{padding:6px 11px;font-size:13px}
.card{border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--bg);box-shadow:var(--sh)}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.1fr 1fr}.ga{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.hero{background:linear-gradient(135deg,#06402a,#0e9f62 130%);color:#fff;border:0;padding:28px;position:relative;overflow:hidden}
.hero .big{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin:6px 0 4px}.hero .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}.hero .btn.p{background:#fff;color:var(--gd)}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(255,255,255,.2);box-shadow:0 0 0 40px rgba(255,255,255,.05),0 0 0 90px rgba(255,255,255,.04)}
.st .v{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:4px}.pos{color:var(--g)}.neg{color:var(--neg)}
.row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);border-radius:10px}.row:last-child{border:0}
.row.c{cursor:pointer}.row.c:hover{background:var(--soft)}.row .m{flex:1;min-width:0}.row .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .r{text-align:right}
.ic{width:40px;height:40px;border-radius:12px;background:var(--g2);display:grid;place-items:center;font-size:19px;flex:none}
.av{border-radius:50%;color:#fff;display:inline-grid;place-items:center;font-weight:700;flex:none;border:2px solid var(--bg)}.avs{display:flex}.avs .av{margin-left:-8px}.avs .av:first-child{margin:0}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--mut);font-weight:600;border:1px solid var(--line)}
.chip.on{background:var(--g2);color:var(--gd);border-color:#a7e3c4;cursor:pointer}.chip.of{cursor:pointer}
.donut{width:160px;height:160px;transform:rotate(-90deg)}.donut circle{fill:none;stroke-width:20;animation:d 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes d{from{stroke-dasharray:0 340}}@keyframes gr{from{transform:scaleY(0)}}
.bars{display:flex;align-items:flex-end;gap:12px;height:160px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mut);gap:6px}
.bars i{width:100%;background:var(--g);border-radius:8px 8px 3px 3px;transform-origin:bottom;animation:gr .8s cubic-bezier(.2,.8,.2,1) both;min-height:3px}.bars div:not(.cur) i{background:#a7e3c4}
.leg{display:grid;gap:8px;flex:1}.leg span{display:flex;align-items:center;gap:8px;font-size:13px}.leg i{width:10px;height:10px;border-radius:3px}.leg b{margin-left:auto}
.gc{cursor:pointer;transition:.2s}.gc:hover{transform:translateY(-3px);border-color:#a7e3c4}
.new{border-style:dashed;display:grid;place-items:center;color:var(--mut);font-weight:700;min-height:140px;cursor:pointer;box-shadow:none}.new:hover{color:var(--g);border-color:var(--g)}
.bal{display:grid;grid-template-columns:90px 1fr 80px;gap:10px;align-items:center;font-size:13px;padding:5px 0}.bal span{height:8px;border-radius:9px;background:var(--soft);position:relative;overflow:hidden}.bal span i{position:absolute;top:0;bottom:0;border-radius:9px}
.tr{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--soft);border-radius:12px;margin-bottom:8px;flex-wrap:wrap}.tr .arr{color:var(--g);font-weight:800}.tr .btn{margin-left:auto}
#modal{position:fixed;inset:0;background:rgba(6,18,12,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}.mod{background:var(--bg);border-radius:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:24px;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}@keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}}
.mod h2{font-size:20px;margin-bottom:16px}.f{display:grid;gap:6px;margin-bottom:12px}.f label{font-size:12px;font-weight:700;color:var(--mut)}
.f input,.f select,.num{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:10px 12px;width:100%;outline:none}.f input:focus,.f select:focus,.num:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--g2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.amt{display:grid;grid-template-columns:1fr 100px;gap:8px}
.seg{display:flex;background:var(--soft);padding:3px;border-radius:11px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;padding:7px;border-radius:9px;font-weight:700;color:var(--mut);cursor:pointer}.seg button.on{background:var(--bg);color:var(--ink);box-shadow:var(--sh)}
.pr{display:flex;align-items:center;gap:10px;padding:7px 4px;cursor:pointer}.pr span{flex:1}.pr .num{width:90px;padding:6px 8px}.pr em{font-style:normal;color:var(--mut);width:34px}.pr input[type=checkbox]{accent-color:var(--g);width:17px;height:17px}
.warn{color:var(--neg)}.ok{color:var(--g)}.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:99}.toast.on{opacity:1;transform:translate(-50%,0)}
.drop{border:2px dashed var(--line);border-radius:18px;padding:40px 20px;text-align:center;background:var(--soft)}
.rc{background:#fff;color:#222;border-radius:6px;padding:18px;font:12px/1.7 ui-monospace,Menlo,monospace;max-width:300px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.12);position:relative;overflow:hidden}
.rc:after{content:"";position:absolute;left:0;right:0;height:46px;top:-46px;background:linear-gradient(transparent,rgba(14,159,98,.35));border-bottom:2px solid var(--g);animation:sc 1.6s linear infinite}@keyframes sc{to{top:100%}}
.rc div{display:flex;justify-content:space-between}.rc img{width:100%}
.tabs{display:none}
@media(max-width:820px){.app{display:block}aside{display:none}main{padding:18px 16px 110px}
.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;justify-content:space-around}
.tabs .nl{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px}.tabs .bd{position:absolute;top:0;right:4px;margin:0;padding:0 5px}
.g3,.g2{grid-template-columns:1fr}.hero .big{font-size:36px}h1{font-size:23px}.two{grid-template-columns:1fr}.toast{bottom:100px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="root"></div><div id="modal"></div><div class="toast" id="toast"></div>
<script>
const R={EUR:1,USD:1.08,GBP:.85,CHF:.96,JPY:163,CAD:1.47,AUD:1.65},ME='u0',CAT={Food:['🍽','#0e9f62'],Travel:['✈️','#075a38'],Home:['🏠','#5ad3a0'],Fun:['🎟','#1f3a2e'],Transport:['🚕','#9db3a7'],Other:['🧾','#c9d6cf']},GT={trip:'✈️',home:'🏠',couple:'💚',friends:'🥂',direct:'👤'};
const $=s=>document.querySelector(s),id=()=>Math.random().toString(36).slice(2,9),day=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
let S,D,M,SC={st:0,items:[],gid:'g1',paid:ME,name:''};
function seed(){const u=(i,n,c)=>({id:i,name:n,color:c,email:n.toLowerCase().split(' ')[0]+'@mail.com'});
const users=[u('u0','Alex Morgan','#0c1a13'),u('u1','Mia Keller','#2563eb'),u('u2','Jonas Weber','#d97706'),u('u3','Sofia Rossi','#db2777'),u('u4','Luca Bianchi','#7c3aed'),u('u5','Priya Nair','#0891b2')];
const groups=[{id:'g1',name:'Lisbon Trip',type:'trip',cur:'EUR',members:['u0','u1','u2','u3']},{id:'g2',name:'Flat 4B',type:'home',cur:'GBP',members:['u0','u4','u5']},{id:'g3',name:'Sofia & me',type:'couple',cur:'CHF',members:['u0','u3']}];
const E=[];const x=(gid,desc,amt,cur,paid,cat,d,inc)=>{const m=inc||groups.find(g=>g.id===gid).members;E.push({id:id(),gid,desc,amt,cur,paid,cat,date:day(d),mode:'equal',vals:{},shares:Object.fromEntries(m.map(k=>[k,amt/m.length]))})};
x('g1','Airbnb in Alfama',640,'EUR','u1','Travel',12);x('g1','Dinner at Ramiro',148.6,'EUR','u0','Food',11);x('g1','Trams & Uber',34.2,'EUR','u2','Transport',10);x('g1','Fado night tickets',96,'EUR','u3','Fun',10);x('g1','Pastéis de nata run',18.4,'EUR','u0','Food',9,['u0','u1','u3']);
x('g2','Electricity bill',96.4,'GBP','u4','Home',20);x('g2','Tesco groceries',54.75,'GBP','u0','Food',6);x('g2','Wi-Fi',29.99,'GBP','u5','Home',35);x('g2','Cleaning supplies',18.2,'GBP','u0','Home',3);x('g2','Pizza night',41,'GBP','u5','Food',1);
x('g3','Train to Zürich',84,'CHF','u0','Travel',40);x('g3','Fondue dinner',112,'CHF','u3','Food',38);x('g3','Movie night',28,'USD','u3','Fun',5);x('g3','Sunday brunch',46,'EUR','u0','Food',2);x('g2','Boiler repair',120,'GBP','u0','Home',75);x('g3','Concert tickets',150,'EUR','u3','Fun',105);x('g1','Flights to Lisbon',420,'EUR','u2','Travel',130);
const a=(t,txt,d,x={})=>({id:id(),t,txt,ts:day(d),read:d>3,...x});
return{base:'EUR',users,groups,expenses:E,payments:[],activity:[a('inv','Luca invited you to join Ski Weekend',0,{g:'Ski Weekend',pend:1}),a('exp','Priya added Pizza night · £41.00 in Flat 4B',1),a('pay','Sofia paid you CHF 20.00',2),a('exp','Alex added Sunday brunch · €46.00 in Sofia & me',2),a('note','Reminder: Mia hasn’t settled Lisbon Trip yet',4),a('exp','Jonas added Trams & Uber · €34.20 in Lisbon Trip',10)]}}
try{S=JSON.parse(localStorage.getItem('tt-v1'))}catch(e){}S=S||seed();
const save=()=>{try{localStorage.setItem('tt-v1',JSON.stringify(S))}catch(e){}};
const U=i=>S.users.find(u=>u.id===i)||{name:'?',color:'#999'},nm=i=>i===ME?'You':U(i).name,G=i=>S.groups.find(g=>g.id===i),b=(a,c)=>a/R[c]*R[S.base];
const money=(a,c=S.base,sg)=>(sg&&a>0.004?'+':'')+new Intl.NumberFormat('en',{style:'currency',currency:c,maximumFractionDigits:c==='JPY'?0:2}).format(a);
const av=(i,s=32)=>`<span class="av" style="background:${U(i).color};width:${s}px;height:${s}px;font-size:${s*.4}px">${U(i).name[0]}</span>`;
const avs=m=>`<span class="avs">${m.slice(0,5).map(i=>av(i,28)).join('')}</span>`;
const fd=d=>new Date(d+'T12:00').toLocaleDateString('en',{month:'short',day:'numeric'});
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)};
const log=(t,txt,x)=>{S.activity.unshift({id:id(),t,txt,ts:day(0),read:false,...x})};
function net(gid){const n={},ad=(u,v)=>n[u]=(n[u]||0)+v;S.expenses.filter(e=>e.gid===gid).forEach(e=>{ad(e.paid,b(e.amt,e.cur));for(const u in e.shares)ad(u,-b(e.shares[u],e.cur))});S.payments.filter(p=>p.gid===gid).forEach(p=>{ad(p.from,b(p.amt,p.cur));ad(p.to,-b(p.amt,p.cur))});return n}
function plan(n){const c=[],d=[];for(const u in n){if(n[u]>.005)c.push([u,n[u]]);else if(n[u]<-.005)d.push([u,-n[u]])}c.sort((a,b)=>b[1]-a[1]);d.sort((a,b)=>b[1]-a[1]);const o=[];let i=0,j=0;while(i<c.length&&j<d.length){const a=Math.min(c[i][1],d[j][1]);o.push({from:d[j][0],to:c[i][0],amt:a});c[i][1]-=a;d[j][1]-=a;if(c[i][1]<.005)i++;if(d[j][1]<.005)j++}return o}
function pair(f){let t=0;S.expenses.forEach(e=>{if(e.paid===ME&&e.shares[f])t+=b(e.shares[f],e.cur);if(e.paid===f&&e.shares[ME])t-=b(e.shares[ME],e.cur)});S.payments.forEach(p=>{if(p.from===ME&&p.to===f)t+=b(p.amt,p.cur);if(p.from===f&&p.to===ME)t-=b(p.amt,p.cur)});return t}
function totals(){let o=0,w=0;S.groups.forEach(g=>{const v=net(g.id)[ME]||0;v>0?w+=v:o-=v});return{o,w}}
const bc=a=>`<span class="${a>.005?'pos':a<-.005?'neg':'sub'}">${Math.abs(a)<.005?'settled up':(a>0?'owed ':'owe ')+money(Math.abs(a))}</span>`;
const exRow=(e,ed)=>`<div class="row c" onclick="A.edit('${e.id}')"><div class="ic">${CAT[e.cat][0]}</div><div class="m"><b>${e.desc}</b><span class="sub">${fd(e.date)} · ${nm(e.paid)} paid${ed?'':' · '+(G(e.gid)||{}).name}</span></div><div class="r"><b>${money(e.amt,e.cur)}</b><div class="sub">${e.cur!==S.base?'≈ '+money(b(e.amt,e.cur)):'your share '+money(b(e.shares[ME]||0,e.cur))}</div></div>${ed?`<button class="btn s d" onclick="event.stopPropagation();A.del('${e.id}')">Delete</button>`:''}</div>`;
const ic={dash:'M3 11l9-8 9 8v10H3z',groups:'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20c0-3 3-5 7-5s7 2 7 5M17 11a3 3 0 1 0 0-6M19 15c2 .5 3 2 3 5',friends:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM5 21c0-4 3-6 7-6s7 2 7 6',scan:'M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16',activity:'M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7zM10 20h4'};
/* views */
function dash(){const{o,w}=totals(),m=new Date().toISOString().slice(0,7),cats={},mon={};let spent=0;
S.expenses.forEach(e=>{const s=b(e.shares[ME]||0,e.cur);cats[e.cat]=(cats[e.cat]||0)+s;mon[e.date.slice(0,7)]=(mon[e.date.slice(0,7)]||0)+s;if(e.date.slice(0,7)===m)spent+=s});
const ct=Object.values(cats).reduce((a,c)=>a+c,0)||1;let off=0;const C=339.3;
const arcs=Object.entries(cats).sort((a,c)=>c[1]-a[1]).map(([k,v])=>{const l=v/ct*C,s=`<circle cx="80" cy="80" r="54" stroke="${CAT[k][1]}" stroke-dasharray="${Math.max(l-2,0)} ${C}" stroke-dashoffset="${-off}"/>`;off+=l;return[k,v,s]});
const ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);ms.push([d.toISOString().slice(0,7),d.toLocaleDateString('en',{month:'short'})])}const mx=Math.max(...ms.map(k=>mon[k[0]]||0),1);
return`<div class="top"><div><h1>Good evening, Alex</h1><div class="sub">Here’s where your money stands today.</div></div><button class="btn p" onclick="A.exp()">+ Add expense</button></div>
<div class="grid" style="gap:16px"><div class="card hero"><div style="opacity:.8">Net balance</div><div class="big">${money(w-o,S.base,1)}</div><div style="opacity:.8;margin-bottom:18px">across ${S.groups.length} groups · shown in ${S.base}</div><div style="display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1"><button class="btn p" onclick="A.settle()">Settle up</button><button class="btn" onclick="location.hash='#/scan'">Scan receipt</button></div></div>
<div class="grid g3"><div class="card st"><span class="sub">You owe</span><div class="v neg">${money(o)}</div></div><div class="card st"><span class="sub">You’re owed</span><div class="v pos">${money(w)}</div></div><div class="card st"><span class="sub">Your spending this month</span><div class="v">${money(spent)}</div></div></div>
<div class="grid g2"><div class="card"><h2>Spending by category</h2><div style="display:flex;gap:22px;align-items:center;margin-top:14px;flex-wrap:wrap"><svg class="donut" viewBox="0 0 160 160">${arcs.map(a=>a[2]).join('')}</svg><div class="leg">${arcs.map(a=>`<span><i style="background:${CAT[a[0]][1]}"></i>${a[0]}<b>${money(a[1])}</b></span>`).join('')}</div></div></div>
<div class="card"><h2>Last 6 months</h2><div class="bars" style="margin-top:18px">${ms.map((k,i)=>`<div class="${i==5?'cur':''}"><i style="height:${(mon[k[0]]||0)/mx*100*.8}%"></i>${k[1]}</div>`).join('')}</div></div></div>
<div class="card"><div class="top" style="margin-bottom:6px"><h2>Recent expenses</h2></div>${S.expenses.slice().sort((a,c)=>c.date.localeCompare(a.date)).slice(0,6).map(e=>exRow(e)).join('')||'<p class="sub">No expenses yet.</p>'}</div></div>`}
function groups(){return`<div class="top"><div><h1>Groups</h1><div class="sub">Trips, roommates, couples and friends.</div></div><button class="btn p" onclick="A.grp()">+ New group</button></div><div class="grid ga">${S.groups.map(g=>{const v=net(g.id)[ME]||0;return`<div class="card gc" onclick="location.hash='#/group/${g.id}'"><div style="display:flex;justify-content:space-between"><div class="ic">${GT[g.type]}</div>${avs(g.members)}</div><h2 style="margin-top:14px">${g.name}</h2><div class="sub">${g.members.length} members · ${S.expenses.filter(e=>e.gid===g.id).length} expenses</div><div style="margin-top:10px">${bc(v)}</div></div>`}).join('')}<div class="card new" onclick="A.grp()">+ Create a group</div></div>`}
function group(i){const g=G(i);if(!g)return groups();const n=net(i),mx=Math.max(...g.members.map(u=>Math.abs(n[u]||0)),1),pl=plan(n),ex=S.expenses.filter(e=>e.gid===i).sort((a,c)=>c.date.localeCompare(a.date));
return`<a class="sub" href="#/groups">← Groups</a><div class="top" style="margin-top:8px"><div><h1>${GT[g.type]} ${g.name}</h1><div class="sub">${g.members.map(nm).join(', ')}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="A.mem('${i}')">Add member</button><button class="btn" onclick="A.settle('${i}')">Settle up</button><button class="btn p" onclick="A.exp('${i}')">+ Add expense</button></div></div>
<div class="grid g2"><div class="card"><h2>Balances</h2><div style="margin-top:10px">${g.members.map(u=>{const v=n[u]||0,w=Math.abs(v)/mx*50;return`<div class="bal"><b>${nm(u)}</b><span><i style="${v>=0?'left:50%;background:var(--g)':'right:50%;background:var(--neg)'};width:${w}%"></i></span><b class="${v>=0?'pos':'neg'}" style="text-align:right">${money(v,S.base,1)}</b></div>`}).join('')}</div></div>
<div class="card"><h2>Simplest way to settle</h2><p class="sub" style="margin:4px 0 12px">${pl.length?pl.length+' payment'+(pl.length>1?'s':'')+' clear everything.':''}</p>${pl.map((p,k)=>tr(p,i)).join('')||'<div class="sub">Everyone is settled up. 🎉</div>'}</div></div>
<div class="card" style="margin-top:16px"><h2>Expenses</h2>${ex.map(e=>exRow(e,1)).join('')||'<p class="sub">No expenses yet — add the first one.</p>'}</div>
<p style="margin-top:16px"><button class="btn d s" onclick="A.delg('${i}')">Delete group</button></p>`}
const tr=(p,gid)=>`<div class="tr">${av(p.from,28)}<b>${nm(p.from)}</b><span class="arr">pays</span>${av(p.to,28)}<b>${nm(p.to)}</b><b style="margin-left:6px">${money(p.amt)}</b><button class="btn s p" onclick="A.pay('${gid}','${p.from}','${p.to}',${p.amt})">Record payment</button></div>`;
function friends(){const f=S.users.filter(u=>u.id!==ME);return`<div class="top"><div><h1>Friends</h1><div class="sub">Everyone you share expenses with.</div></div><button class="btn p" onclick="A.fr()">+ Add friend</button></div><div class="grid ga">${f.map(u=>{const v=pair(u.id),sh=S.expenses.filter(e=>(e.paid===u.id&&e.shares[ME])||(e.paid===ME&&e.shares[u.id]));return`<div class="card"><div style="display:flex;gap:12px;align-items:center">${av(u.id,44)}<div><b>${u.name}</b><div class="sub">${u.email||''}</div></div></div><div style="margin:14px 0 4px;font-size:20px;font-weight:800" class="${v>.005?'pos':v<-.005?'neg':''}">${Math.abs(v)<.005?'Settled up':(v>0?'Owes you ':'You owe ')+money(Math.abs(v))}</div><div class="sub">${sh.length} shared expense${sh.length==1?'':'s'}${sh[0]?' · latest: '+sh.sort((a,c)=>c.date.localeCompare(a.date))[0].desc:''}</div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn s" onclick="A.fexp('${u.id}')">Add expense</button>${Math.abs(v)>.005?`<button class="btn s" onclick="A.fset('${u.id}',${v})">Settle</button>`:''}${v>.005?`<button class="btn s" onclick="toast('Reminder sent to ${u.name.split(' ')[0]}')">Remind</button>`:''}</div></div>`}).join('')}</div>`}
function activity(){return`<div class="top"><div><h1>Activity</h1><div class="sub">Expenses, payments and invitations.</div></div><button class="btn" onclick="A.read()">Mark all as read</button></div><div class="card">${S.activity.map(a=>`<div class="row"><div class="ic">${{exp:'🧾',pay:'💸',inv:'✉️',note:'🔔'}[a.t]}</div><div class="m"><b style="white-space:normal">${a.txt}</b><span class="sub">${fd(a.ts)}</span></div>${a.pend?`<button class="btn s p" onclick="A.acc('${a.id}')">Accept</button><button class="btn s" onclick="A.dec('${a.id}')">Decline</button>`:!a.read?'<span class="chip on">New</span>':''}</div>`).join('')}</div>`}
/* scan */
const RC=[['Burrata',9.5],['Tagliatelle ragù',16],['Margherita',12.5],['Branzino',24],['Aperol Spritz ×3',25.5],['Tiramisu ×2',14]];
function scan(){const g=G(SC.gid),m=g.members;let h=`<div class="top"><div><h1>Receipt scanner</h1><div class="sub">Upload a receipt and split it line by line.</div></div></div>`;
if(SC.st==0)return h+`<div class="card"><div class="drop"><div style="font-size:38px">🧾</div><h2 style="margin:8px 0">Drop a receipt to extract every item</h2><p class="sub">Photo or PDF. This demo simulates the AI extraction.</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><label class="btn p">Upload receipt<input type="file" accept="image/*,.pdf" hidden onchange="A.up(this)"></label><button class="btn" onclick="A.scan()">Try a sample</button></div></div></div>`;
if(SC.st==1)return h+`<div class="card" style="text-align:center"><div class="rc">${SC.img?`<img src="${SC.img}">`:`<b>TRATTORIA SOLE</b><br>Rua da Rosa 12, Lisboa<br>${RC.map(r=>`<div><span>${r[0]}</span><span>${r[1].toFixed(2)}</span></div>`).join('')}<div><span>Service 10%</span><span>…</span></div>`}</div><h2 style="margin-top:18px">Reading items, prices and tax…</h2></div>`;
const sub=SC.items.reduce((a,i)=>a+i.p,0),tot=sub*1.1,sh=scanShares();
return h+`<div class="grid g2"><div class="card"><div class="f"><label>Group</label><select onchange="SC.gid=this.value;SC.items.forEach(i=>i.who=[...G(SC.gid).members]);SC.paid=ME;render()">${S.groups.map(x=>`<option value="${x.id}" ${x.id==SC.gid?'selected':''}>${x.name}</option>`).join('')}</select></div><h2>${SC.items.length} items found · tap names to assign</h2>${SC.items.map((it,k)=>`<div class="row" style="align-items:flex-start"><div class="m"><b>${it.n}</b><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">${m.map(u=>`<span class="chip ${it.who.includes(u)?'on':'of'}" onclick="A.as(${k},'${u}')">${nm(u)}</span>`).join('')}</div></div><b>${money(it.p,'EUR')}</b></div>`).join('')}<div class="row"><span class="m sub">Service 10%, shared proportionally</span><b>${money(sub*.1,'EUR')}</b></div><div class="row"><b class="m">Total</b><b>${money(tot,'EUR')}</b></div></div>
<div class="card"><h2>Who owes what</h2>${m.map(u=>`<div class="row">${av(u,30)}<b class="m">${nm(u)}</b><b>${money(sh[u]||0,'EUR')}</b></div>`).join('')}<div class="f" style="margin-top:12px"><label>Paid by</label><select onchange="SC.paid=this.value">${m.map(u=>`<option value="${u}" ${u==SC.paid?'selected':''}>${nm(u)}</option>`).join('')}</select></div><div class="foot"><button class="btn" onclick="SC.st=0;SC.img=0;render()">Start over</button><button class="btn p" onclick="A.ssave()">Create expense</button></div></div></div>`}
function scanShares(){const o={};SC.items.forEach(i=>{if(i.who.length)i.who.forEach(u=>o[u]=(o[u]||0)+i.p/i.who.length*1.1)});return o}
/* modals */
const sel=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
const mem=()=>G(D.gid).members;
function sh(u){const n=mem().filter(k=>D.inc[k]).length||1;return D.mode=='equal'?D.amt/n:D.mode=='pct'?D.amt*(D.vals[u]||0)/100:(D.vals[u]||0)}
function part(){return mem().map(u=>`<label class="pr"><input type="checkbox" ${D.inc[u]?'checked':''} onchange="A.tog('${u}')">${av(u,26)}<span>${nm(u)}</span>${D.mode!='equal'&&D.inc[u]?`<input class="num" type="number" step="any" value="${D.vals[u]??''}" oninput="D.vals['${u}']=+this.value;sum()"><em>${D.mode=='pct'?'%':D.cur}</em>`:`<b id="s${u}">${D.inc[u]?money(sh(u),D.cur):''}</b>`}</label>`).join('')+'<div id="sum" class="sub" style="padding:6px 4px"></div>'}
function sum(){mem().forEach(u=>{const e=$('#s'+u);if(e)e.textContent=D.inc[u]?money(sh(u),D.cur):''});const t=mem().filter(u=>D.inc[u]).reduce((a,u)=>a+(D.vals[u]||0),0),e=$('#sum');if(!e)return;if(D.mode=='equal'){e.textContent='Split equally between '+mem().filter(u=>D.inc[u]).length+' people';e.className='sub';return}
const left=D.mode=='pct'?100-t:D.amt-t,ok=Math.abs(left)<.01;e.className=ok?'ok':'warn';e.textContent=ok?'Split adds up ✓':(left>0?(D.mode=='pct'?left.toFixed(1)+'%':money(left,D.cur))+' left to assign':(D.mode=='pct'?(-left).toFixed(1)+'%':money(-left,D.cur))+' over')}
function modal(){const el=$('#modal');if(!M){el.className='';el.innerHTML='';return}el.className='on';let h='';
if(M.t=='exp')h=`<h2>${D.id?'Edit':'Add'} expense</h2><div class="f"><label>Description</label><input value="${D.desc}" placeholder="Dinner, taxi, rent…" oninput="D.desc=this.value"></div><div class="f"><label>Amount</label><div class="amt"><input type="number" step="any" value="${D.amt||''}" placeholder="0.00" oninput="D.amt=+this.value;sum()"><select onchange="D.cur=this.value;modal()">${sel(Object.keys(R),D.cur)}</select></div>${D.cur!=S.base&&D.amt?`<span class="sub">≈ ${money(b(D.amt,D.cur))} at today’s rate</span>`:''}</div>
<div class="two"><div class="f"><label>Group</label><select onchange="A.dg(this.value)">${S.groups.map(g=>`<option value="${g.id}" ${g.id==D.gid?'selected':''}>${g.name}</option>`).join('')}</select></div><div class="f"><label>Paid by</label><select onchange="D.paid=this.value">${mem().map(u=>`<option value="${u}" ${u==D.paid?'selected':''}>${nm(u)}</option>`).join('')}</select></div></div>
<div class="two"><div class="f"><label>Category</label><select onchange="D.cat=this.value">${sel(Object.keys(CAT),D.cat)}</select></div><div class="f"><label>Date</label><input type="date" value="${D.date}" onchange="D.date=this.value"></div></div>
<div class="f"><label>Split</label></div><div class="seg">${[['equal','Equally'],['pct','Percent'],['exact','Amounts']].map(x=>`<button class="${D.mode==x[0]?'on':''}" onclick="A.mode('${x[0]}')">${x[1]}</button>`).join('')}</div><div id="part">${part()}</div><div class="foot"><button class="btn" onclick="A.close()">Cancel</button><button class="btn p" onclick="A.save()">Save expense</button></div>`;
if(M.t=='grp')h=`<h2>New group</h2><div class="f"><label>Name</label><input id="gn" placeholder="Summer in Split"></div><div class="two"><div class="f"><label>Type</label><select id="gt"><option value="trip">Trip</option><option value="home">Roommates</option><option value="couple">Couple</option><option value="friends">Friends</option></select></div><div class="f"><label>Currency</label><select id="gc">${sel(Object.keys(R),S.base)}</select></div></div><div class="f"><label>Members</label></div>${S.users.filter(u=>u.id!=ME).map(u=>`<label class="pr"><input type="checkbox" class="gm" value="${u.id}">${av(u.id,26)}<span>${u.name}</span></label>`).join('')}<div class="f"><label>Or invite someone new</label><input id="gx" placeholder="Name"></div><div class="foot"><button class="btn" onclick="A.close()">Cancel</button><button class="btn p" onclick="A.gsave()">Create group</button></div>`;
if(M.t=='mem'){const o=S.users.filter(u=>!G(M.g).members.includes(u.id));h=`<h2>Add member to ${G(M.g).name}</h2>${o.length?`<div class="f"><label>Existing friend</label><select id="mu"><option value="">Choose…</option>${o.map(u=>`<option value="${u.id}">${u.name}</option>`).join('')}</select></div>`:''}<div class="f"><label>Or invite by name</label><input id="mn" placeholder="Name"></div><div class="foot"><button class="btn" onclick="A.close()">Cancel</button><button class="btn p" onclick="A.msave()">Add member</button></div>`}
if(M.t=='fr')h=`<h2>Add friend</h2><div class="f"><label>Name</label><input id="fn"></div><div class="f"><label>Email</label><input id="fe" type="email"></div><div class="foot"><button class="btn" onclick="A.close()">Cancel</button><button class="btn p" onclick="A.fsave()">Add friend</button></div>`;
if(M.t=='set'){const gs=M.g?[G(M.g)]:S.groups,l=gs.flatMap(g=>plan(net(g.id)).map(p=>tr(p,g.id).replace('<div class="tr">',`<div class="tr"><span class="chip">${g.name}</span>`)));h=`<h2>Settle up</h2><p class="sub">The fewest payments that clear all debts.</p>${l.join('')||'<p class="sub">Nothing to settle. 🎉</p>'}<div class="foot"><button class="btn" onclick="A.close()">Close</button></div>`}
el.innerHTML=`<div class="mod">${h}</div>`;if(M.t=='exp')sum()}
/* actions */
const A={close(){M=null;modal()},
draft(e,gid){const g=G(gid);D=e?{...e,inc:Object.fromEntries(Object.keys(e.shares).map(k=>[k,1])),vals:{...(e.mode=='exact'?e.shares:e.vals)}}:{desc:'',amt:0,cur:g.cur,gid,paid:ME,cat:'Food',date:day(0),mode:'equal',inc:Object.fromEntries(g.members.map(k=>[k,1])),vals:{}};M={t:'exp'};modal()},
exp(gid){this.draft(0,gid||S.groups[0].id)},edit(i){this.draft(S.expenses.find(e=>e.id==i),S.expenses.find(e=>e.id==i).gid)},
fexp(f){let g=S.groups.find(g=>g.type=='direct'&&g.members.length==2&&g.members.includes(f));if(!g){g={id:id(),name:'You & '+U(f).name.split(' ')[0],type:'direct',cur:S.base,members:[ME,f]};S.groups.push(g);save()}this.draft(0,g.id)},
dg(v){D.gid=v;const g=G(v);D.inc=Object.fromEntries(g.members.map(k=>[k,1]));D.paid=g.members.includes(D.paid)?D.paid:g.members[0];D.vals={};D.mode='equal';modal()},
tog(u){D.inc[u]=!D.inc[u];if(D.mode!='equal'){this.mode(D.mode);return}$('#part').innerHTML=part();sum()},
mode(m){D.mode=m;const ks=mem().filter(k=>D.inc[k]);D.vals={};ks.forEach(k=>D.vals[k]=m=='pct'?+(100/ks.length).toFixed(2):m=='exact'?+(D.amt/ks.length).toFixed(2):0);modal()},
save(){const ks=mem().filter(k=>D.inc[k]);if(!D.desc.trim())return toast('Add a description');if(!(D.amt>0))return toast('Enter an amount');if(!ks.length)return toast('Choose at least one person');
const sh={};ks.forEach(k=>sh[k]=sh_(k));if(D.mode!='equal'&&Math.abs(Object.values(sh).reduce((a,c)=>a+c,0)-D.amt)>.01)return toast('The split doesn’t add up to the total');
const e={id:D.id||id(),gid:D.gid,desc:D.desc.trim(),amt:D.amt,cur:D.cur,paid:D.paid,cat:D.cat,date:D.date,mode:D.mode,vals:D.vals,shares:sh};
const i=S.expenses.findIndex(x=>x.id==e.id);i<0?S.expenses.push(e):S.expenses[i]=e;log('exp',`${nm(e.paid)} ${i<0?'added':'updated'} ${e.desc} · ${money(e.amt,e.cur)} in ${G(e.gid).name}`,{read:true});save();M=null;render();toast(i<0?'Expense added — balances updated':'Expense updated')},
del(i){if(!confirm('Delete this expense?'))return;const e=S.expenses.find(x=>x.id==i);S.expenses=S.expenses.filter(x=>x.id!=i);log('exp','You deleted '+e.desc,{read:true});save();render();toast('Expense deleted')},
grp(){M={t:'grp'};modal()},
gsave(){const n=$('#gn').value.trim();if(!n)return toast('Name your group');const m=[ME,...[...document.querySelectorAll('.gm:checked')].map(x=>x.value)],x=$('#gx').value.trim();if(x)m.push(newUser(x));const g={id:id(),name:n,type:$('#gt').value,cur:$('#gc').value,members:m};S.groups.push(g);log('note','You created '+n,{read:true});save();M=null;location.hash='#/group/'+g.id;render();toast('Group created')},
mem(g){M={t:'mem',g};modal()},
msave(){const g=G(M.g);let u=$('#mu')&&$('#mu').value;const n=$('#mn').value.trim();if(!u&&n)u=newUser(n);if(!u)return toast('Choose or name someone');g.members.push(u);log('note',nm(u)+' joined '+g.name,{read:true});save();M=null;render();toast('Member added')},
delg(i){if(!confirm('Delete this group and its expenses?'))return;S.groups=S.groups.filter(g=>g.id!=i);S.expenses=S.expenses.filter(e=>e.gid!=i);save();location.hash='#/groups';toast('Group deleted')},
fr(){M={t:'fr'};modal()},fsave(){const n=$('#fn').value.trim();if(!n)return toast('Enter a name');const u=newUser(n);U(u).email=$('#fe').value;log('inv','You invited '+n,{read:true});save();M=null;render();toast('Invitation sent')},
settle(g){M={t:'set',g};modal()},
pay(g,f,t,a){S.payments.push({id:id(),gid:g,from:f,to:t,amt:a,cur:S.base,date:day(0)});log('pay',`${nm(f)} paid ${nm(t)} ${money(a)}`,{read:true});save();M&&M.t=='set'?M={t:'set',g:M.g}:0;render();toast('Payment recorded')},
fset(f,v){const g=S.groups.find(g=>g.members.includes(ME)&&g.members.includes(f));if(!g)return;this.pay(g.id,v>0?f:ME,v>0?ME:f,Math.abs(v))},
read(){S.activity.forEach(a=>a.read=true);save();render()},
acc(i){const a=S.activity.find(x=>x.id==i),m=[ME,'u4','u1'];S.groups.push({id:id(),name:a.g,type:'trip',cur:'EUR',members:m});a.pend=0;a.read=true;a.txt='You joined '+a.g;save();render();toast('Joined '+a.g)},
dec(i){S.activity=S.activity.filter(a=>a.id!=i);save();render()},
scan(){SC.st=1;SC.items=RC.map(r=>({n:r[0],p:r[1],who:[...G(SC.gid).members]}));SC.paid=ME;render();setTimeout(()=>{SC.st=2;if(location.hash.includes('scan'))render()},2400)},
up(inp){const f=inp.files[0];if(!f)return;SC.img=f.type.startsWith('image/')?URL.createObjectURL(f):0;this.scan()},
as(k,u){const w=SC.items[k].who;w.includes(u)?w.splice(w.indexOf(u),1):w.push(u);render()},
ssave(){const s=scanShares(),t=Object.values(s).reduce((a,c)=>a+c,0);if(!t)return toast('Assign at least one item');S.expenses.push({id:id(),gid:SC.gid,desc:'Trattoria Sole (scanned)',amt:+t.toFixed(2),cur:'EUR',paid:SC.paid,cat:'Food',date:day(0),mode:'exact',vals:{},shares:s});log('exp',`Receipt split · ${money(t,'EUR')} in ${G(SC.gid).name}`,{read:true});save();SC.st=0;location.hash='#/group/'+SC.gid;toast('Itemized expense created')}};
const sh_=k=>sh(k);
function newUser(n){const i=id();S.users.push({id:i,name:n,color:['#2563eb','#d97706','#db2777','#7c3aed','#0891b2'][S.users.length%5],email:n.toLowerCase().split(' ')[0]+'@mail.com'});return i}
function render(){const r=(location.hash.slice(2)||'dash').split('/'),v={dash,groups,group,friends,activity,scan}[r[0]]?r[0]:'dash',un=S.activity.filter(a=>!a.read).length;
const nav=[['dash','Home'],['groups','Groups'],['friends','Friends'],['scan','Scan'],['activity','Activity']].map(n=>`<a class="nl ${v==n[0]||(v=='group'&&n[0]=='groups')?'on':''}" href="#/${n[0]}"><svg viewBox="0 0 24 24"><path d="${ic[n[0]]}"/></svg>${n[1]}${n[0]=='activity'&&un?`<span class="bd">${un}</span>`:''}</a>`).join('');
$('#root').innerHTML=`<div class="app"><aside><div class="logo"><i>t</i>ThriftyThrifty</div>${nav}<div class="side-f"><label>Show balances in</label><select class="num" onchange="S.base=this.value;save();render()">${sel(Object.keys(R),S.base)}</select><button class="btn s" onclick="if(confirm('Reset all demo data?')){localStorage.removeItem('tt-v1');location.reload()}">Reset demo data</button></div></aside><main>${{dash,groups,group,friends,activity,scan}[v](r[1])}</main><nav class="tabs">${nav}</nav></div>`;modal()}
addEventListener('hashchange',()=>{M=null;window.scrollTo(0,0);render()});render();
</script></body></html>
